<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pase y GOL - Noticias y Estadísticas de Fútbol</title>
    <meta name="description" content="Portal completo de noticias y estadísticas del fútbol ecuatoriano e internacional. Resultados, posiciones, fichajes y más." />
    <meta name="author" content="Pase y GOL" />
    
    <!-- Performance optimizations -->
    <meta http-equiv="x-dns-prefetch-control" content="on">
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/logo192.png">
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json">
    
    <!-- SEO and Open Graph tags -->
    <meta property="og:title" content="Pase y GOL - Noticias de Fútbol" />
    <meta property="og:description" content="Portal completo de noticias y estadísticas del fútbol ecuatoriano e internacional." />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- Critical resources preload -->
    <link rel="preload" href="/src/index.css" as="style">
    <link rel="preload" href="/src/main.tsx" as="script">
    <link rel="preload" as="font" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" crossorigin>
    
    <!-- Preload key images used in LCP -->
    <link rel="preload" as="image" href="/logo192.png" fetchpriority="high">
    
    <!-- Google Fonts with display=swap for better performance -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    
    <!-- Inline critical CSS -->
    <style>
      /* Critical CSS for initial render */
      :root {
        --background: #ffffff;
        --foreground: #1f2937;
        --primary: #ed1909;
        --primary-foreground: #ffffff;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: var(--background);
        color: var(--foreground);
      }
      #root {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      img {
        max-width: 100%;
        height: auto;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #1f2937;
          --foreground: #f9fafb;
        }
      }
      
      /* Loading indicator styles */
      .app-loading {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        z-index: 999999;
        background: linear-gradient(to right, var(--primary), #88e312);
        transform: translateX(-100%);
        animation: loading 1.5s ease-in-out infinite;
      }
      @keyframes loading {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(100%); }
        100% { transform: translateX(100%); }
      }
    </style>
    
    <!-- Theme color for browser UI -->
    <meta name="theme-color" content="#ed1909">
    
    <!-- Responsiveness -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
  </head>

  <body>
    <!-- Initial loading indicator (visible before React loads) -->
    <div class="app-loading"></div>
    
    <div id="root"></div>
    <noscript>Necesitas habilitar JavaScript para ejecutar esta aplicación.</noscript>
    
    <!-- Defer non-critical script loading -->
    <script type="module" src="/src/main.tsx" defer></script>
    
    <!-- Inline script to avoid render-blocking -->
    <script>
      // Remove loading indicator when app is loaded
      window.addEventListener('load', function() {
        document.querySelector('.app-loading')?.remove();
      });
      
      // Add minimal support for dark mode before React loads
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.classList.add('dark');
      }
    </script>
  </body>
</html>
